            -webkit-backdrop-filter: blur(16px);

        ::-webkit-scrollbar-track {
            background: #020617;

<body class="antialiased selection:bg-emerald-500 selection:text-slate-950 min-h-screen relative">

    <!-- React Application Component Script -->

        const { useState, useEffect, useRef } = React;

        // --- Lucide Icon SVG Components ---

        const TrendingUp = (props) => (

        const FileText = (props) => (
            <Icon path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></>} {...props} />
        );
        const Presentation = (props) => (
            <Icon path={<><path d="M2 3h20" /><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3" /><path d="m7 21 5-5 5 5" /></>} {...props} />
        );
        const GraduationCap = (props) => (
            <Icon path={<><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></>} {...props} />
        );
        const Award = (props) => (
            <Icon path={<><circle cx="12" cy="8" r="7" /><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" /></>} {...props} />
        );
        const CheckCircle2 = (props) => (
            <Icon path={<><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></>} {...props} />
        );
        const ExternalLink = (props) => (
            <Icon path={<><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></>} {...props} />
        );
        const Calendar = (props) => (
            <Icon path={<><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></>} {...props} />
        );
        const MapPin = (props) => (
            <Icon path={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>} {...props} />
        );
        const Mail = (props) => (
            <Icon path={<><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></>} {...props} />
        );
        const Phone = (props) => (
            <Icon path={<><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></>} {...props} />
        );
        const Linkedin = (props) => (
            <Icon path={<><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" /><rect x="2" y="9" width="4" height="12" /><circle cx="4" cy="4" r="2" /></>} {...props} />
        );
        const ShieldCheck = (props) => (
            <Icon path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="m9 12 2 2 4-4" /></>} {...props} />
        );
        const BarChart3 = (props) => (
            <Icon path={<><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></>} {...props} />
        );
        const Briefcase = (props) => (
            <Icon path={<><rect width="20" height="14" x="2" y="7" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></>} {...props} />
        );
        const Layers = (props) => (
            <Icon path={<><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></>} {...props} />
        );
        const Sparkles = (props) => (
            <Icon path={<><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z" /></>} {...props} />
        );
        const Copy = (props) => (
            <Icon path={<><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></>} {...props} />
        );
        const X = (props) => (
            <Icon path={<><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>} {...props} />
        );
        const Menu = (props) => (
            <Icon path={<><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="6" x2="20" y2="6" /><line x1="4" y1="18" x2="20" y2="18" /></>} {...props} />
        );
        const Download = (props) => (
            <Icon path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></>} {...props} />
        );
        const Clock = (props) => (
            <Icon path={<><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>} {...props} />
        );

        // --- Main Application Component ---
        function App() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const [activeModal, setActiveModal] = useState(null);
            const [activeMetric, setActiveMetric] = useState('roce');
            const chartCanvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage('');
                }, 3000);
            };

            const copyEmail = () => {
                navigator.clipboard.writeText('accameetbansal@gmail.com').then(() => {
                    showToast('Email address copied to clipboard!');
                }).catch(() => {
                    showToast('Email: accameetbansal@gmail.com');
                });
            };

            // Chart Configuration
            const chartDatasets = {
                roce: {
                    label: 'Return on Capital Employed (ROCE %)',
                    unit: '%',
                    coke: [15.0, 15.3, 13.0],
                    pepsi: [17.6, 17.4, 18.9],
                    summary: "PepsiCo consistently generated higher ROCE (17.6% - 18.9%), fueled by asset turnover velocity in snack foods, while Coca-Cola's capital-intensive bottler re-franchising transitions impacted its capital base."
                },
                grossMargin: {
                    label: 'Gross Profit Margin (%)',
                    unit: '%',
                    coke: [58.1, 59.5, 60.4],
                    pepsi: [53.0, 54.2, 54.8],
                    summary: "Coca-Cola sustained industry-leading gross margins peaking at 60.4% in 2024, demonstrating formidable brand pricing power and an asset-light concentrate licensing model compared to PepsiCo's capital-heavy direct distribution."
                }
            };

            useEffect(() => {
                if (!chartCanvasRef.current) return;

                const ctx = chartCanvasRef.current.getContext('2d');
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                const currentData = chartDatasets[activeMetric];

                chartInstanceRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['2022', '2023', '2024'],
                        datasets: [
                            {
                                label: 'The Coca-Cola Company',
                                data: currentData.coke,
                                backgroundColor: '#10b981', // Vibrant Emerald
                                borderRadius: 8,
                                barPercentage: 0.65,
                                categoryPercentage: 0.75,
                            },
                            {
                                label: 'PepsiCo, Inc.',
                                data: currentData.pepsi,
                                backgroundColor: '#0284c7', // Slate Sky Blue
                                borderRadius: 8,
                                barPercentage: 0.65,
                                categoryPercentage: 0.75,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: {
                            duration: 500,
                            easing: 'easeOutQuart'
                        },
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    color: '#cbd5e1',
                                    font: { family: 'Inter', size: 12, weight: 600 },
                                    usePointStyle: true,
                                    pointStyleWidth: 10,
                                    padding: 20
                                }
                            },
                            tooltip: {
                                backgroundColor: '#020617',
                                borderColor: 'rgba(255, 255, 255, 0.15)',
                                borderWidth: 1,
                                titleFont: { family: 'Outfit', size: 14, weight: 'bold' },
                                bodyFont: { family: 'Inter', size: 13 },
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        return `${context.dataset.label}: ${context.parsed.y}${currentData.unit}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.06)',
                                    drawBorder: false,
                                },
                                ticks: {
                                    color: '#94a3b8',
                                    font: { family: 'Inter', size: 11 },
                                    callback: function(value) {
                                        return value + currentData.unit;
                                    }
                                }
                            },
                            x: {
                                grid: { display: false },
                                ticks: {
                                    color: '#cbd5e1',
                                    font: { family: 'Inter', size: 12, weight: 600 }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                    }
                };
            }, [activeMetric]);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950">
                    
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 border border-emerald-500/50 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">
                            <CheckCircle2 className="w-5 h-5 text-emerald-400" />
                            <span className="text-sm font-medium">{toastMessage}</span>
                        </div>
                    )}

                    {/* ========================================================
                        SECTION 1: HERO SECTION
                        Top Navigation, Main Header, Subtitle, Description, Buttons, 4 Bottom Hero Cards
                        ======================================================== */}
                    <div className="relative glow-radial grid-pattern">
                        {/* Top Navigation */}
                        <header className="fixed top-0 left-0 right-0 z-40 bg-slate-950/85 backdrop-blur-xl border-b border-white/10">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div className="flex justify-between items-center h-20">
                                    {/* Logo */}
                                    <a href="#" className="flex items-center gap-3 group">
                                        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-slate-950 font-bold font-heading text-lg shadow-lg shadow-emerald-500/25 group-hover:scale-105 transition-transform">
                                            MB
                                        </div>
                                        <div>
                                            <span className="font-heading font-bold text-lg text-white tracking-tight block leading-tight">
                                                Meet Bansal
                                            </span>
                                            <span className="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider block">
                                                Financial Analyst
                                            </span>
                                        </div>
                                    </a>

                                    {/* Navigation Links */}
                                    <nav className="hidden md:flex items-center space-x-1 lg:space-x-2">
                                        <a href="#research" className="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
                                            Research
                                        </a>
                                        <a href="#projects" className="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
                                            Tech App
                                        </a>
                                        <a href="#experience" className="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
                                            Experience
                                        </a>
                                        <a href="#skills" className="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
                                            Skills
                                        </a>
                                        <a href="#certifications" className="px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-colors">
                                            Certifications
                                        </a>
                                    </nav>

                                    {/* Action Buttons */}
                                    <div className="hidden md:flex items-center gap-3">
                                        <button
                                            onClick={() => setActiveModal('cv')}
                                            className="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white border border-white/10 hover:border-white/25 transition-all flex items-center gap-2"
                                        >
                                            <FileText className="w-4 h-4 text-emerald-400" />
                                            CV Summary
                                        </button>
                                        <a
                                            href="mailto:accameetbansal@gmail.com"
                                            className="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold text-sm rounded-lg transition-all shadow-md shadow-emerald-500/20 flex items-center gap-2"
                                        >
                                            <Mail className="w-4 h-4" />
                                            Let's Connect
                                        </a>
                                    </div>

                                    {/* Mobile Menu Toggle */}
                                    <div className="flex md:hidden">
                                        <button
                                            onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                            className="text-slate-300 hover:text-white p-2"
                                            aria-label="Toggle navigation"
                                        >
                                            {mobileMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Mobile Dropdown Menu */}
                            {mobileMenuOpen && (
                                <div className="md:hidden border-b border-white/10 bg-slate-950/95 backdrop-blur-2xl px-4 pt-3 pb-6 space-y-3">
                                    <a
                                        href="#research"
                                        onClick={() => setMobileMenuOpen(false)}
                                        className="block py-2 text-slate-200 hover:text-emerald-400 font-medium"
                                    >
                                        Research
                                    </a>
                                    <a
                                        href="#projects"
                                        onClick={() => setMobileMenuOpen(false)}
                                        className="block py-2 text-slate-200 hover:text-emerald-400 font-medium"
                                    >
                                        Tech App
                                    </a>
                                    <a
                                        href="#experience"
                                        onClick={() => setMobileMenuOpen(false)}
                                        className="block py-2 text-slate-200 hover:text-emerald-400 font-medium"
                                    >
                                        Experience
                                    </a>
                                    <a
                                        href="#skills"
                                        onClick={() => setMobileMenuOpen(false)}
                                        className="block py-2 text-slate-200 hover:text-emerald-400 font-medium"
                                    >
                                        Skills
                                    </a>
                                    <a
                                        href="#certifications"
                                        onClick={() => setMobileMenuOpen(false)}
                                        className="block py-2 text-slate-200 hover:text-emerald-400 font-medium"
                                    >
                                        Certifications
                                    </a>
                                    <div className="pt-4 flex flex-col gap-2.5">
                                        <button
                                            onClick={() => { setActiveModal('cv'); setMobileMenuOpen(false); }}
                                            className="w-full py-2.5 rounded-lg text-sm font-medium bg-white/10 text-white text-center flex items-center justify-center gap-2"
                                        >
                                            <FileText className="w-4 h-4 text-emerald-400" />
                                            CV Summary
                                        </button>
                                        <a
                                            href="mailto:accameetbansal@gmail.com"
                                            className="w-full py-2.5 rounded-lg text-sm font-semibold bg-emerald-500 text-slate-950 text-center"
                                        >
                                            Let's Connect
                                        </a>
                                    </div>
                                </div>
                            )}
                        </header>

                        {/* Hero Content */}
                        <section className="pt-36 pb-20 md:pt-48 md:pb-28 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
                            {/* Availability Badge */}
                            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-900/90 border border-emerald-500/30 text-xs sm:text-sm font-medium mb-8 backdrop-blur-md shadow-lg shadow-emerald-500/10">
                                <span className="flex h-2.5 w-2.5 relative">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
                                </span>
                                <span className="text-slate-300">Open to Institutional Finance & Analyst Roles (UK / Global)</span>
                            </div>

                            {/* Main Header */}
                            <h1 className="text-4xl sm:text-6xl lg:text-7xl font-bold tracking-tight text-white mb-4 leading-tight font-heading">
                                Meet Bansal
                            </h1>

                            {/* Subtitle */}
                            <p className="text-xl sm:text-2xl lg:text-3xl font-heading font-medium text-emerald-400 mb-6 max-w-3xl mx-auto">
                                Financial Analyst & ACCA Affiliate
                            </p>

                            {/* Description */}
                            <p className="text-base sm:text-lg text-slate-300 mb-10 max-w-3xl mx-auto font-light leading-relaxed">
                                MSc Finance Candidate at Durham University | CFA Level 1 Candidate (Feb 2026). Synthesizing IFRS statutory reporting, DCF valuation, and quantitative metrics into actionable strategic insights.
                            </p>

                            {/* Hero Action Buttons */}
                            <div className="flex flex-col sm:flex-row gap-4 justify-center items-center mb-16">
                                <a
                                    href="#research"
                                    className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold transition-all shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2.5"
                                >
                                    <TrendingUp className="w-5 h-5" />
                                    Explore Equity Research
                                </a>
                                <button
                                    onClick={() => setActiveModal('cv')}
                                    className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-white/5 hover:bg-white/10 text-white font-medium border border-white/10 hover:border-white/25 transition-all backdrop-blur-md flex items-center justify-center gap-2"
                                >
                                    <FileText className="w-5 h-5 text-emerald-400" />
                                    Executive Resume
                                </button>
                                <button
                                    onClick={copyEmail}
                                    className="w-full sm:w-auto px-5 py-3.5 rounded-xl bg-slate-900/60 hover:bg-slate-800 text-slate-300 hover:text-white border border-white/10 transition-all flex items-center justify-center gap-2"
                                    title="Copy Email"
                                >
                                    <Copy className="w-4 h-4 text-emerald-400" />
                                    Copy Email
                                </button>
                            </div>

                            {/* Bottom Hero Grid (4 identical cards) */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-left">
